<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Puja ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Georgia, "Times New Roman", serif;
            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255, 255, 255, 0.18),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(255, 180, 200, 0.15),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #2b0a18,
                    #7b1638 45%,
                    #d44768 100%
                );
            position: relative;
        }

        /* Soft glowing background */
        .glow {
            position: absolute;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: rgba(255, 120, 160, 0.16);
            filter: blur(70px);
        }

        /* Main glass card */
        .card {
            position: relative;
            z-index: 2;
            width: min(90%, 620px);
            padding: 65px 35px;
            text-align: center;

            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 28px;

            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.35);
        }

        /* Main heart */
        .heart {
            font-size: 58px;
            margin-bottom: 20px;

            animation: beat 1.5s infinite;

            filter:
                drop-shadow(
                    0 0 15px rgba(255, 100, 140, 0.7)
                );
        }

        /* Message */
        h1 {
            margin: 0;
            color: white;

            font-size: clamp(30px, 7vw, 52px);
            font-weight: normal;

            text-shadow:
                0 3px 20px rgba(0, 0, 0, 0.25);
        }

        /* Floating decorations */
        .sparkle {
            position: absolute;
            color: rgba(255, 255, 255, 0.75);

            animation: float 6s linear infinite;

            user-select: none;
        }

        .s1 {
            left: 8%;
            top: 15%;
            animation-delay: 0s;
        }

        .s2 {
            left: 85%;
            top: 20%;
            animation-delay: 2s;
        }

        .s3 {
            left: 18%;
            top: 75%;
            animation-delay: 4s;
        }

        .s4 {
            left: 78%;
            top: 72%;
            animation-delay: 1s;
        }

        /* Heartbeat animation */
        @keyframes beat {
            0%, 100% {
                transform: scale(1);
            }

            15% {
                transform: scale(1.16);
            }

            30% {
                transform: scale(1);
            }
        }

        /* Floating animation */
        @keyframes float {
            0% {
                transform: translateY(20px);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            80% {
                opacity: 1;
            }

            100% {
                transform: translateY(-60px);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="glow"></div>

    <div class="sparkle s1">♥</div>
    <div class="sparkle s2">✦</div>
    <div class="sparkle s3">♥</div>
    <div class="sparkle s4">✦</div>

    <div class="card">
        <div class="heart">❤️</div>

        <h1>
            I’m sorry, Puja. 🥺❤️
        </h1>
    </div>

</body>
</html>
